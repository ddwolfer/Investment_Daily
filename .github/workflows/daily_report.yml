name: Daily Investment Report

on:
  schedule:
    # 台北時間 06:00 = UTC 22:00 (前一日)
    # Cron 格式: 分 時 日 月 星期
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Install dependencies
        run: uv sync
      
      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}' > credentials.json
          # 驗證 JSON 格式是否正確（可選，但建議）
          python -m json.tool credentials.json > /dev/null && echo "✅ credentials.json 格式驗證通過"
        env:
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}
      
      - name: Run investment bot
        env:
          # Python 編碼設定（避免中文亂碼）
          PYTHONUTF8: 1
          
          # Telegram Bot 設定
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          
          # LLM API 設定
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # Google Sheets 設定
          GOOGLE_SHEET_ID_STOCK: ${{ secrets.GOOGLE_SHEET_ID_STOCK }}
          GOOGLE_SHEET_ID_CRYPTO: ${{ secrets.GOOGLE_SHEET_ID_CRYPTO }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GOOGLE_CREDENTIALS_FILE: credentials.json
        run: uv run python -m investment_bot.main
